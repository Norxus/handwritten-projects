[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handwritten-mem0"
version = "0.1.0"
description = "Handwritten mem0 learning project"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "pydantic>=2.7.3",
  "openai>=1.90.0",
  "qdrant-client>=1.12.0",
  "sqlalchemy>=2.0.31",
  "protobuf>=5.29.6,<7.0.0",
  "pytz>=2024.1",
  "posthog>=4.5.0"
]

[project.optional-dependencies]
nlp = [
  "spacy>=3.7.0"
]
dev = [
  "pytest>=8.2.2",
  "ruff>=0.6.5"
]

[tool.hatch.build]
include = ["mem0/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["mem0"]

[tool.ruff]
line-length = 120
